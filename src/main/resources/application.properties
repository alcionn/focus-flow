spring.application.name=focusflow

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/focusflow}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8080

# Show validation messages to the frontend
server.error.include-message=always