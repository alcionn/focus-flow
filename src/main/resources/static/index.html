<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141C33">
    <title>FocusFlow</title>

    <link rel="icon" href="img/logo.svg" type="image/svg+xml">

    <!-- Fonts (falls back to system fonts if offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ICON SPRITE: every icon in the app lives here. Use with <svg><use href="#i-name"/></svg> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
            <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
            <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></symbol>
            <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
            <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></symbol>
            <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></symbol>
            <symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></symbol>
            <symbol id="i-gamepad" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 12.5h4M9 10.5v4M15.5 11.5h.01M17.5 13.5h.01"/></symbol>
            <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
            <symbol id="i-dots" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
            <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
            <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
            <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
            <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
            <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
            <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.5 1 2 2 2-.5-3 0-5 1-8z"/></symbol>
            <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12h.01"/></symbol>
            <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
            <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
            <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></symbol>
            <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
            <symbol id="i-trend-up" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></symbol>
            <symbol id="i-trend-down" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8M15 17h6v-6"/></symbol>
            <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5h.01"/></symbol>
            <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
            <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
            <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
        </defs>
    </svg>

    <div class="app">

        <!-- SIDEBAR (desktop) -->
        <aside class="side">
            <a class="brand" href="#dashboard" aria-label="FocusFlow home">
                <img src="img/logo.svg" alt="" width="32" height="32">
                <span>FocusFlow</span>
            </a>

            <nav class="nav" aria-label="Main">
                <a class="nav__link" data-nav="dashboard" href="#dashboard">
                    <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>Dashboard
                </a>
                <a class="nav__link" data-nav="log" href="#log">
                    <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Log activity
                </a>
                <a class="nav__link" data-nav="insights" href="#insights">
                    <svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Insights
                </a>
                <a class="nav__link" data-nav="history" href="#history">
                    <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>History
                </a>
            </nav>

            <div class="side__foot">
                <!-- LATER: put the user avatar / "Sign in" button here when you add login -->
                <button class="nav__link nav__btn" type="button" data-action="settings">
                    <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>Settings
                </button>
            </div>
        </aside>

        <div class="main">

            <header class="topbar">
                <h1 id="pageTitle">Dashboard</h1>
                <div class="topbar__actions">
                    <!-- LATER: notification bell goes here -->
                    <button id="topLog" class="btn btn--primary" type="button" data-action="new-log">
                        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>Log activity
                    </button>
                </div>
            </header>

            <div id="banner" class="banner" role="alert" hidden></div>

            <main id="content">
                <section id="view-dashboard" class="view" aria-labelledby="pageTitle"></section>

                <section id="view-log" class="view" hidden>
                    <div class="wizard">
                        <ol id="stepper" class="stepper" aria-label="Progress"></ol>
                        <div id="wizardBody" class="wizard__body"></div>
                        <div id="wizardFoot" class="wizard__foot"></div>
                    </div>
                </section>

                <section id="view-insights" class="view" hidden></section>

                <section id="view-history" class="view" hidden>
                    <div class="toolbar">
                        <label class="search">
                            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
                            <input id="searchInput" type="search" placeholder="Search activities" autocomplete="off">
                        </label>
                        <div class="seg" role="group" aria-label="Date range">
                            <button type="button" class="seg__btn" data-action="f-range" data-value="7">7 days</button>
                            <button type="button" class="seg__btn" data-action="f-range" data-value="30">30 days</button>
                            <button type="button" class="seg__btn" data-action="f-range" data-value="all">All</button>
                        </div>
                        <button type="button" class="btn btn--ghost" data-action="export">
                            <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Export CSV
                        </button>
                    </div>
                    <div id="historyChips" class="chips" role="group" aria-label="Category filter"></div>
                    <p id="historySummary" class="muted summary"></p>
                    <div id="historyList"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- MOBILE TAB BAR -->
    <nav class="tabbar" aria-label="Main">
        <a class="tabbar__link" data-nav="dashboard" href="#dashboard">
            <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span>
        </a>
        <a class="tabbar__link" data-nav="insights" href="#insights">
            <svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span>Insights</span>
        </a>
        <a class="tabbar__link tabbar__link--log" data-nav="log" href="#log">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Log</span>
        </a>
        <a class="tabbar__link" data-nav="history" href="#history">
            <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span>History</span>
        </a>
        <button class="tabbar__link" type="button" data-action="settings">
            <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span>
        </button>
    </nav>

    <!-- SETTINGS DIALOG -->
    <dialog id="settingsDialog" class="dialog" aria-labelledby="settingsTitle">
        <form id="settingsForm" method="dialog">
            <h2 id="settingsTitle">Settings</h2>
            <label class="field">
                <span class="field__label">Your name</span>
                <input id="setName" type="text" maxlength="30" placeholder="Used in the dashboard greeting">
            </label>
            <label class="field">
                <span class="field__label">Daily productive goal: <strong id="setGoalOut">4h</strong></span>
                <input id="setGoal" type="range" min="30" max="600" step="15" value="240">
                <span class="field__hint">Study, coding and exercise count toward this goal.</span>
            </label>
            <div class="dialog__actions">
                <button class="btn btn--ghost" type="button" data-action="close-dialog">Cancel</button>
                <button class="btn btn--primary" type="submit" value="save">Save settings</button>
            </div>
        </form>
    </dialog>

    <!-- CONFIRM DELETE DIALOG -->
    <dialog id="confirmDialog" class="dialog dialog--small" aria-labelledby="confirmTitle">
        <h2 id="confirmTitle">Delete this activity?</h2>
        <p id="confirmText" class="muted"></p>
        <div class="dialog__actions">
            <button class="btn btn--ghost" type="button" data-action="close-dialog">Keep it</button>
            <button class="btn btn--danger" type="button" data-action="confirm-delete">Delete activity</button>
        </div>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="script.js"></script>
</body>

</html>
